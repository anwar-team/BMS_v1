<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 اختبار البحث السريع</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <div class="max-w-4xl mx-auto p-6">
        <h1 class="text-3xl font-bold text-center mb-6 text-emerald-600">🔍 اختبار البحث API</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">خيارات البحث</h2>
            
            <!-- Search Input -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">كلمة البحث:</label>
                <input type="text" id="searchQuery" value="الله" class="w-full px-4 py-2 border rounded-lg" placeholder="أدخل كلمة البحث...">
            </div>
            
            <!-- Search Type -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">نوع البحث:</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="searchType" value="flexible_match" checked>
                        <span>🔄 مرن (Flexible)</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="radio" name="searchType" value="exact_match">
                        <span>🎯 مطابق (Exact)</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="radio" name="searchType" value="morphological">
                        <span>🌳 صرفي (Morphological)</span>
                    </label>
                </div>
            </div>
            
            <!-- Word Order -->
            <div class="mb-4">
                <label class="block text-sm font-medium mb-2">ترتيب الكلمات:</label>
                <div class="space-y-2">
                    <label class="flex items-center gap-2">
                        <input type="radio" name="wordOrder" value="consecutive">
                        <span>📏 متتالية (Consecutive)</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="radio" name="wordOrder" value="same_paragraph">
                        <span>📄 نفس الفقرة (Same Paragraph)</span>
                    </label>
                    <label class="flex items-center gap-2">
                        <input type="radio" name="wordOrder" value="any_order" checked>
                        <span>🔀 أي ترتيب (Any Order)</span>
                    </label>
                </div>
            </div>
            
            <!-- Search Button -->
            <button onclick="performSearch()" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
                🔍 ابحث الآن
            </button>
        </div>
        
        <!-- API Request -->
        <div class="bg-gray-900 text-white rounded-lg p-4 mb-6 hidden" id="requestPanel">
            <h3 class="font-semibold mb-2">📤 API Request:</h3>
            <pre id="apiRequest" class="text-xs overflow-x-auto bg-gray-800 p-3 rounded"></pre>
        </div>
        
        <!-- Results -->
        <div class="bg-white rounded-lg shadow-lg p-6 hidden" id="resultsPanel">
            <h2 class="text-xl font-semibold mb-4">📊 النتائج</h2>
            <div id="results"></div>
        </div>
        
        <!-- Error -->
        <div class="bg-red-50 border border-red-200 rounded-lg p-4 hidden" id="errorPanel">
            <h3 class="font-semibold text-red-700 mb-2">❌ خطأ:</h3>
            <pre id="errorMessage" class="text-sm text-red-600"></pre>
        </div>
    </div>
    
    <script>
        async function performSearch() {
            const query = document.getElementById('searchQuery').value.trim();
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            const wordOrder = document.querySelector('input[name="wordOrder"]:checked').value;
            
            if (!query) {
                alert('الرجاء إدخال كلمة البحث');
                return;
            }
            
            // Build API URL
            const params = new URLSearchParams({
                q: query,
                search_type: searchType,
                word_order: wordOrder,
                per_page: 10,
                page: 1
            });
            
            const apiUrl = `/api/ultra-search?${params}`;
            
            // Show request
            document.getElementById('requestPanel').classList.remove('hidden');
            document.getElementById('apiRequest').textContent = `GET ${apiUrl}\n\nParameters:\n${JSON.stringify({
                q: query,
                search_type: searchType,
                word_order: wordOrder
            }, null, 2)}`;
            
            // Hide previous results/errors
            document.getElementById('resultsPanel').classList.add('hidden');
            document.getElementById('errorPanel').classList.add('hidden');
            
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (data.success) {
                    // Show results
                    document.getElementById('resultsPanel').classList.remove('hidden');
                    const resultsDiv = document.getElementById('results');
                    
                    resultsDiv.innerHTML = `
                        <div class="mb-4 p-4 bg-emerald-50 rounded-lg">
                            <div class="grid grid-cols-2 gap-4 text-sm">
                                <div><strong>إجمالي النتائج:</strong> ${data.total.toLocaleString()}</div>
                                <div><strong>وقت البحث:</strong> ${data.search_time} ms</div>
                                <div><strong>الصفحة الحالية:</strong> ${data.current_page}</div>
                                <div><strong>عدد الصفحات:</strong> ${data.last_page}</div>
                            </div>
                        </div>
                        
                        <div class="space-y-4">
                            ${data.data.map((result, index) => `
                                <div class="border rounded-lg p-4 hover:shadow-md transition">
                                    <div class="flex items-start justify-between mb-2">
                                        <div class="flex-1">
                                            <span class="inline-block bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-semibold">
                                                #${index + 1}
                                            </span>
                                            <h3 class="font-bold text-lg mt-2">${result.book_title || 'غير معروف'}</h3>
                                            <p class="text-sm text-gray-600">${result.author_names || 'مؤلف غير معروف'}</p>
                                        </div>
                                        <div class="text-left">
                                            <span class="text-xs text-gray-500">الصفحة ${result.page_number}</span>
                                        </div>
                                    </div>
                                    <div class="mt-3 p-3 bg-gray-50 rounded-lg">
                                        <p class="text-sm leading-relaxed" dir="rtl">${result.highlighted_content || result.content.substring(0, 200) + '...'}</p>
                                    </div>
                                    <div class="mt-2 text-xs text-gray-500">
                                        Score: ${result.score ? result.score.toFixed(2) : 'N/A'}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    // Show error
                    document.getElementById('errorPanel').classList.remove('hidden');
                    document.getElementById('errorMessage').textContent = data.message || 'حدث خطأ غير معروف';
                }
            } catch (error) {
                // Show error
                document.getElementById('errorPanel').classList.remove('hidden');
                document.getElementById('errorMessage').textContent = `Network Error:\n${error.message}\n\nتأكد من تشغيل السيرفر على http://127.0.0.1:8000`;
            }
        }
        
        // Allow Enter key to search
        document.getElementById('searchQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
    </script>
</body>
</html>
