# Pipeline محسن للنصوص العربية في مشروع BMS
input {
  # استقبال البيانات من قاعدة البيانات MySQL
  jdbc {
    jdbc_driver_library => "/usr/share/logstash/mysql-connector.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    jdbc_connection_string => "jdbc:mysql://145.223.98.97:3306/bms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true"
    jdbc_user => "bms"
    jdbc_password => "bms2025"
    
    # جدولة التشغيل (كل دقيقة للفهرسة السريعة)
    schedule => "* * * * *"
    
    # استعلام محسن لجلب جميع الصفحات مع البيانات العربية (مطابق لـ Laravel Scout)
    statement => "
      SELECT
        p.id,
        p.content,
        p.page_number,
        p.updated_at,
        p.created_at,
        b.id as book_id,
        b.title as book_title,
        b.slug as book_slug,
        b.description as book_description
      FROM pages p
      LEFT JOIN books b ON p.book_id = b.id
      WHERE p.updated_at > :sql_last_value AND p.content IS NOT NULL AND p.content != ''
      ORDER BY p.updated_at ASC
      LIMIT 5000
    "    # إعدادات التتبع
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/.logstash_jdbc_last_run"
    
    # نوع البيانات
    type => "arabic_page"
    
    # إعدادات الاتصال المحسنة للسرعة
    jdbc_pool_timeout => 10
    jdbc_validate_connection => true
    jdbc_validation_timeout => 3
    jdbc_fetch_size => 10000
  }
}

filter {
  # معالجة البيانات العربية
  if [type] == "arabic_page" {
    
    # تنظيف وإعداد المحتوى العربي
    mutate {
      # إزالة HTML tags
      gsub => [
        "content", "<[^>]*>", "",
        "book_title", "<[^>]*>", "",
        "book_description", "<[^>]*>", ""
      ]
      
      # تنظيف الأحرف الخاصة والمسافات الزائدة
      gsub => [
        "content", "[\r\n\t]+", " ",
        "content", "\s+", " ",
        "book_title", "[\r\n\t]+", " ",
        "book_title", "\s+", " "
      ]
      
      # إزالة الأحرف غير المرغوب فيها
      gsub => [
        "content", "[^\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\u0020-\u007E]", " "
      ]
    }
    
    # تحويل author_ids إلى مصفوفة
    if [author_ids] and [author_ids] != "" {
      mutate {
        split => { "author_ids" => "," }
        convert => { "author_ids" => "integer" }
      }
    }
    
    # تحويل author_slugs إلى مصفوفة
    if [author_slugs] and [author_slugs] != "" {
      mutate {
        split => { "author_slugs" => "," }
      }
    }
    
    # إنشاء محتوى قابل للبحث محسن للعربية (مطابق لـ Laravel Scout)
    mutate {
      add_field => {
        "searchable_content" => "%{content}"
        "searchable_title" => "%{book_title}"
        "searchable_authors" => "%{author_names}"
        "searchable_all" => "%{content} %{book_title} %{author_names} %{book_description} %{volume_title} %{chapter_title}"
        "document_type" => "arabic_page"
        "indexed_at" => "%{@timestamp}"
      }
    }
    
    # تحسين البحث بناءً على نوع المحتوى
    if [book_section] {
      if [book_section] =~ /قرآن|تفسير/ {
        mutate { replace => { "search_boost" => "2.0" } }
      } else if [book_section] =~ /حديث|سنة/ {
        mutate { replace => { "search_boost" => "1.8" } }
      } else if [book_section] =~ /فقه/ {
        mutate { replace => { "search_boost" => "1.5" } }
      }
    }
    
    # تحويل التواريخ
    date {
      match => [ "updated_at", "yyyy-MM-dd HH:mm:ss" ]
      target => "last_modified"
    }
    
    date {
      match => [ "created_at", "yyyy-MM-dd HH:mm:ss" ]
      target => "created_date"
    }
    
    # إنشاء معرف فريد للوثيقة
    mutate {
      add_field => { "document_id" => "page_%{id}" }
    }
    
    # تحويل الأرقام
    mutate {
      convert => { 
        "id" => "integer"
        "page_number" => "integer"
        "book_id" => "integer"
        "book_section_id" => "integer"
        "volume_id" => "integer"
        "chapter_id" => "integer"
        "search_boost" => "float"
      }
    }
    
    # إزالة الحقول الفارغة
    if [content] == "" or [content] == " " {
      drop { }
    }
  }
}

output {
  # إرسال البيانات إلى Elasticsearch مع إعدادات عربية متقدمة
  if [type] == "arabic_page" {
    elasticsearch {
      hosts => ["145.223.98.97:9201"]
      index => "pages"
      document_id => "%{id}"
    }
  }
  
  # سجل للمراقبة والتطوير
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}