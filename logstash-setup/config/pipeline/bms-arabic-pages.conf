# إعدادات Logstash Pipeline لفهرسة الصفحات العربية من BMS
# تحسين متقدم للأداء والبحث العربي

input {
  jdbc {
    # إعدادات قاعدة البيانات
    jdbc_connection_string => "jdbc:mysql://145.223.98.97:3306/bms?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC"
    jdbc_user => "bms"
    jdbc_password => "bms2025"
    jdbc_driver_library => "/usr/share/logstash/mysql-connector.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"
    
    # استعلام محسن للحصول على البيانات
    statement => "
      SELECT 
        p.id,
        p.page_number,
        p.content,
        p.created_at,
        p.updated_at,
        p.book_id,
        b.title as book_title,
        a.full_name as book_author,
        bs.name as book_section,
        CHAR_LENGTH(p.content) as content_length
      FROM pages p 
      LEFT JOIN books b ON p.book_id = b.id 
      LEFT JOIN author_book ab ON b.id = ab.book_id AND ab.is_main = 1
      LEFT JOIN authors a ON ab.author_id = a.id
      LEFT JOIN book_sections bs ON b.book_section_id = bs.id
      WHERE p.updated_at > :sql_last_value 
      ORDER BY p.updated_at ASC 
      LIMIT 10000
    "
    
    # إعدادات التزامن والأداء (محسنة للسرعة القصوى)
    schedule => "*/10 * * * * *"  # كل 10 ثوان
    jdbc_fetch_size => 25000      # عدد كبير للسرعة
    use_column_value => true
    tracking_column => "updated_at"
    tracking_column_type => "timestamp"
    record_last_run => true
    last_run_metadata_path => "/usr/share/logstash/data/.logstash_jdbc_last_run_pages"
    
    # إعدادات ECS
    ecs_compatibility => disabled
    
    # إضافة نوع للتمييز
    type => "arabic_page"
  }
}

filter {
  if [type] == "arabic_page" {
    # تنظيف النص العربي وتحسينه
    mutate {
      ecs_compatibility => disabled
      
      # إزالة الأحرف غير المرغوبة
      gsub => [
        "content", "[\u0640]", "",           # إزالة التطويل
        "content", "[\u064B-\u065F]", "",    # إزالة التشكيل
        "content", "[\u200B-\u200F]", "",    # إزالة الأحرف غير المرئية
        "content", "\s+", " "                # توحيد المسافات
      ]
      
      # تطبيع الحروف العربية
      gsub => [
        "content", "[إأآ]", "ا",            # توحيد الألف
        "content", "[ؤ]", "و",               # توحيد الواو
        "content", "[ئ]", "ي",               # توحيد الياء
        "content", "[ة]", "ه"                # توحيد التاء المربوطة
      ]
      
      # تنظيف العنوان
      gsub => [
        "book_title", "[\u064B-\u065F]", "", # إزالة التشكيل من العنوان
        "book_title", "\s+", " "             # توحيد المسافات
      ]
      
      # تنظيف اسم المؤلف
      gsub => [
        "book_author", "[\u064B-\u065F]", "", # إزالة التشكيل
        "book_author", "\s+", " "             # توحيد المسافات
      ]
      
      strip => ["content", "book_title", "book_author", "book_section"]
    }
    
    # إنشاء حقول بحث محسنة
    mutate {
      ecs_compatibility => disabled
      
      add_field => { 
        "content_normalized" => "%{content}"
        "search_text" => "%{content} %{book_title} %{book_author}"
      }
    }
    
    # تحسين البحث بناءً على نوع المحتوى
    if [book_section] {
      if [book_section] =~ /قرآن|تفسير/ {
        mutate { 
          ecs_compatibility => disabled
          replace => { "search_boost" => "2.0" }
          add_field => { "book_category" => "قرآن وتفسير" }
        }
      } else if [book_section] =~ /حديث|سنة/ {
        mutate { 
          ecs_compatibility => disabled
          replace => { "search_boost" => "1.8" }
          add_field => { "book_category" => "حديث وسنة" }
        }
      } else if [book_section] =~ /فقه/ {
        mutate { 
          ecs_compatibility => disabled
          replace => { "search_boost" => "1.5" }
          add_field => { "book_category" => "فقه" }
        }
      } else {
        mutate { 
          ecs_compatibility => disabled
          replace => { "search_boost" => "1.0" }
          add_field => { "book_category" => "عام" }
        }
      }
    } else {
      mutate { 
        ecs_compatibility => disabled
        replace => { "search_boost" => "1.0" }
        add_field => { "book_category" => "غير محدد" }
      }
    }
    
    # تحديد صعوبة المحتوى بناءً على الطول
    if [content_length] {
      if [content_length] < 500 {
        mutate { 
          ecs_compatibility => disabled
          add_field => { "difficulty_level" => "سهل" } 
        }
      } else if [content_length] < 1500 {
        mutate { 
          ecs_compatibility => disabled
          add_field => { "difficulty_level" => "متوسط" } 
        }
      } else {
        mutate { 
          ecs_compatibility => disabled
          add_field => { "difficulty_level" => "صعب" } 
        }
      }
    }
    
    # إضافة معلومات اللغة
    mutate {
      ecs_compatibility => disabled
      add_field => { "language" => "arabic" }
    }
    
    # تحويل التواريخ
    date {
      match => [ "updated_at", "yyyy-MM-dd HH:mm:ss" ]
      target => "last_modified"
      ecs_compatibility => disabled
    }
    
    date {
      match => [ "created_at", "yyyy-MM-dd HH:mm:ss" ]
      target => "created_date"
      ecs_compatibility => disabled
    }
    
    # إنشاء معرف فريد للوثيقة
    mutate {
      ecs_compatibility => disabled
      add_field => { "document_id" => "page_%{id}" }
    }
    
    # تحويل الأرقام
    mutate {
      ecs_compatibility => disabled
      convert => { 
        "id" => "integer"
        "page_number" => "integer"
        "book_id" => "integer"
        "search_boost" => "float"
        "content_length" => "integer"
      }
    }
    
    # إزالة الحقول الفارغة
    if [content] == "" or [content] == " " {
      drop { }
    }
  }
}

output {
  # إرسال البيانات إلى Elasticsearch مع إعدادات محسنة
  if [type] == "arabic_page" {
    elasticsearch {
      hosts => ["145.223.98.97:9201"]
      index => "pages"
      document_id => "%{id}"
      template_name => "pages_template"
      ecs_compatibility => disabled
    }
  }
  
  # سجل للمراقبة (اختياري)
  # stdout {
  #   codec => dots
  # }
}