<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار واجهة البحث</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-right">اختبار واجهة أنواع البحث</h1>
            
            <!-- نوع البحث -->
            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-700 mb-3 text-right">نوع البحث (النظام الجديد)</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-md cursor-pointer border border-gray-200 transition-all" title="بحث مرن يتعامل مع الكلمات بشكل ذكي مع تطبيع عربي">
                        <input type="radio" name="searchType" value="flexible_match" class="text-emerald-600 focus:ring-emerald-500 w-4 h-4" checked>
                        <div class="flex items-center gap-2 flex-1 text-right">
                            <span class="text-2xl">🔄</span>
                            <div class="flex-1">
                                <span class="text-sm font-medium block">البحث المرن</span>
                                <span class="text-xs text-gray-500">بحث ذكي مع تطبيع عربي (افتراضي)</span>
                            </div>
                        </div>
                    </label>
                    
                    <label class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-md cursor-pointer border border-gray-200 transition-all" title="مطابقة حرفية دقيقة للنص المدخل">
                        <input type="radio" name="searchType" value="exact_match" class="text-blue-600 focus:ring-blue-500 w-4 h-4">
                        <div class="flex items-center gap-2 flex-1 text-right">
                            <span class="text-2xl">🎯</span>
                            <div class="flex-1">
                                <span class="text-sm font-medium block">البحث المطابق</span>
                                <span class="text-xs text-gray-500">مطابقة حرفية دقيقة للنص</span>
                            </div>
                        </div>
                    </label>
                    
                    <label class="flex items-center gap-3 p-3 hover:bg-gray-50 rounded-md cursor-pointer border border-gray-200 transition-all" title="بحث صرفي يتعامل مع الجذور والمشتقات">
                        <input type="radio" name="searchType" value="morphological" class="text-purple-600 focus:ring-purple-500 w-4 h-4">
                        <div class="flex items-center gap-2 flex-1 text-right">
                            <span class="text-2xl">🌳</span>
                            <div class="flex-1">
                                <span class="text-sm font-medium block">البحث الصرفي</span>
                                <span class="text-xs text-gray-500">بحث بالجذور والمشتقات</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>
            
            <!-- معلومات إضافية -->
            <div class="p-4 bg-blue-50 border-l-4 border-blue-400 text-sm text-blue-800 rounded text-right">
                <div class="font-medium mb-2">شرح أنواع البحث:</div>
                <ul class="space-y-1 mr-4">
                    <li>🔄 <strong>المرن:</strong> يبحث بذكاء مع معالجة النصوص العربية (التاء المربوطة، الألف، إلخ)</li>
                    <li>🎯 <strong>المطابق:</strong> يبحث عن النص بالضبط كما كتبته</li>
                    <li>🌳 <strong>الصرفي:</strong> يبحث في الجذور (مثلاً: صلى، صلاة، صلوات، يصلي)</li>
                </ul>
            </div>
            
            <!-- اختبار القيمة المحددة -->
            <div class="mt-6 p-4 bg-gray-50 rounded text-right">
                <h4 class="font-medium mb-2">القيمة المحددة حالياً:</h4>
                <p id="selectedValue" class="text-lg font-bold text-emerald-600">flexible_match</p>
            </div>
        </div>
    </div>
    
    <script>
        // تحديث القيمة المحددة عند التغيير
        document.querySelectorAll('input[name="searchType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.getElementById('selectedValue').textContent = e.target.value;
                console.log('تم تغيير نوع البحث إلى:', e.target.value);
            });
        });
        
        // إضافة highlight للعنصر المحدد
        document.querySelectorAll('input[name="searchType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                // إزالة highlight من الكل
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('bg-emerald-50', 'border-emerald-500');
                });
                
                // إضافة highlight للمحدد
                if(this.checked) {
                    this.closest('label').classList.add('bg-emerald-50', 'border-emerald-500');
                }
            });
        });
        
        // تطبيق highlight على العنصر الافتراضي
        document.querySelector('input[name="searchType"]:checked').closest('label').classList.add('bg-emerald-50', 'border-emerald-500');
    </script>
</body>
</html>
